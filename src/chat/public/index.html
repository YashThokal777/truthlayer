<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TruthLayer Playground</title>
  <style>
    :root {
      --bg: #f3f4f6; --panel: #ffffff; --text: #14161a; --muted: #646b77; --border: #e3e6ea;
      --accent: #4f46e5; --red: #c4302b; --red-bg: #fdecea; --yellow: #8a5a00; --yellow-bg: #fff4d6;
      --green: #12805c; --green-bg: #e3f6ee; --gray-bg: #eef0f3; --code: #f6f7f9;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1014; --panel: #15171c; --text: #eceef2; --muted: #9aa1ad; --border: #2c3039;
        --red: #ff7b72; --red-bg: #3a1a1a; --yellow: #f5c66b; --yellow-bg: #33280f;
        --green: #4fd1a1; --green-bg: #12302a; --gray-bg: #22252d; --code: #1d2027;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    header.top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
    .logo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; }
    .brand { font-weight: 700; letter-spacing: -.01em; }
    .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; letter-spacing: 0; }
    .pill { margin-left: auto; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
    .pill.on { color: var(--green); background: var(--green-bg); border-color: transparent; }
    .pill.off { color: var(--yellow); background: var(--yellow-bg); border-color: transparent; }

    main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; padding: 20px 24px; height: calc(100vh - 61px); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; min-height: 0; display: flex; flex-direction: column; }
    truthlayer-chat { flex: 1; min-height: 0; }
    .chat-card { border: 0; background: transparent; }

    .report-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }
    .report-head h2 { margin: 0; font-size: 16px; }
    .refresh { margin-left: auto; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 9px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
    .refresh:hover { border-color: var(--accent); }
    .scan { color: var(--muted); font-size: 12.5px; padding: 0 18px 12px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 0 18px 14px; }
    .stat { border-radius: 12px; padding: 10px 12px; background: var(--gray-bg); }
    .stat b { display: block; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    .stat.bad b { color: var(--red); } .stat.warn b { color: var(--yellow); } .stat.good b { color: var(--green); }
    .findings { overflow-y: auto; padding: 0 18px 18px; display: grid; gap: 10px; align-content: start; }
    .finding { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .finding .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; }
    .badge.error { color: var(--red); background: var(--red-bg); }
    .badge.warning { color: var(--yellow); background: var(--yellow-bg); }
    .badge.info { color: var(--muted); background: var(--gray-bg); }
    .finding h3 { margin: 0; font-size: 14px; }
    .finding p { margin: 6px 0 8px; color: var(--muted); font-size: 13px; }
    .row { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; padding: 6px 0; border-top: 1px dashed var(--border); font-size: 13px; }
    .row .ico { font-weight: 700; }
    .row.truth .ico { color: var(--green); } .row.outdated .ico { color: var(--red); } .row .ico { color: var(--yellow); }
    .row code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
    .row .age { color: var(--muted); font-size: 12px; }
    .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
    .clean { text-align: center; padding: 40px 20px; color: var(--muted); }
    .clean b { display: block; color: var(--green); font-size: 16px; margin-bottom: 4px; }

    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; height: auto; padding: 16px; }
      .chat-card { height: 72vh; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header.top { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <div class="brand">TruthLayer <small id="product">Playground</small></div>
    <span class="pill" id="ai">Checking AI…</span>
  </header>

  <main>
    <section class="card chat-card" aria-label="Chat">
      <truthlayer-chat mode="inline"></truthlayer-chat>
    </section>

    <section class="card" aria-label="Knowledge report">
      <div class="report-head">
        <h2>Knowledge report</h2>
        <button class="refresh" id="refresh" type="button">Re-check</button>
      </div>
      <div class="scan" id="scan">Loading…</div>
      <div class="stats" id="stats"></div>
      <div class="findings" id="findings"></div>
    </section>
  </main>

  <script src="/widget.js"></script>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const BADGES = { stale: 'Outdated', removed_endpoint: 'Removed endpoint', conflict: 'Conflict', deprecated_endpoint: 'Deprecated', unknown_endpoint: 'Unknown endpoint', old_page: 'Old page' };
    const ICONS = { truth: '✓', outdated: '✗', conflict: '•', warning: '•', old: '•' };
    const ROLES = { truth: 'source of truth', outdated: 'outdated', conflict: 'says', warning: 'mentions', old: 'last updated' };
    const ago = (iso) => {
      if (!iso) return '';
      const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
      return d <= 0 ? 'today' : d === 1 ? '1 day ago' : d < 45 ? `${d} days ago` : `${Math.round(d / 30)} months ago`;
    };

    async function loadInfo() {
      const info = await (await fetch('/api/info')).json();
      document.getElementById('product').textContent = info.name;
      document.title = `${info.name} · TruthLayer`;
      const pill = document.getElementById('ai');
      pill.className = `pill ${info.llm ? 'on' : 'off'}`;
      pill.textContent = info.llm ? `AI on · ${info.model}` : 'Search-only · no API key';
    }

    async function loadReport() {
      const r = await (await fetch('/api/report')).json();
      const s = r.summary;
      document.getElementById('scan').textContent =
        `Scanned ${s.pages} pages, ${s.specs} OpenAPI spec${s.specs === 1 ? '' : 's'}, ${s.changelogs} changelog${s.changelogs === 1 ? '' : 's'} · ${s.facts} facts`;
      const tile = (n, label, kind) => `<div class="stat ${n ? kind : 'good'}"><b>${n}</b><span>${label}</span></div>`;
      document.getElementById('stats').innerHTML =
        tile(s.outdated, 'Outdated', 'bad') + tile(s.conflicts, 'Conflicts', 'bad') +
        tile(s.endpointWarnings, 'Endpoint warnings', 'warn') + tile(s.oldPages, 'Old pages', 'warn');
      const list = document.getElementById('findings');
      if (!r.findings.length) {
        list.innerHTML = '<div class="clean"><b>✓ Everything is in sync</b>No outdated or conflicting facts found.</div>';
        return;
      }
      list.innerHTML = r.findings.map((f) => `
        <article class="finding">
          <div class="top"><span class="badge ${f.severity}">${BADGES[f.type]}</span><h3>${esc(f.title)}</h3></div>
          <p>${esc(f.summary)}</p>
          ${f.type === 'old_page' ? '' : f.items.map((i) => `
            <div class="row ${i.role}">
              <span class="ico" aria-hidden="true">${ICONS[i.role] ?? '•'}</span>
              <span><code>${esc(i.file)}:${i.line}</code> ${esc(i.raw)}
                <span class="age">· ${ROLES[i.role] ?? ''}${i.note ? ` (${esc(i.note)})` : ''} · ${ago(i.date)}</span></span>
            </div>`).join('')}
          ${f.hint ? `<div class="hint">→ ${esc(f.hint)}</div>` : ''}
        </article>`).join('');
    }

    document.getElementById('refresh').addEventListener('click', loadReport);
    loadInfo().catch(() => {});
    loadReport().catch((e) => (document.getElementById('scan').textContent = `Could not load the report: ${e.message}`));
  </script>
</body>
</html>
